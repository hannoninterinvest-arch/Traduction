name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @doctranslate/shared build
      - run: pnpm --filter @doctranslate/api build
      - run: pnpm --filter @doctranslate/web build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @doctranslate/web exec playwright install --with-deps chromium
      - run: pnpm --filter @doctranslate/web test:e2e
        env:
          CI: 'true'
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_AUTH_MODE: dev
